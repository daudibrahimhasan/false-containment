[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "false-containment-experiment"
version = "0.1.0"
description = "Model-independent false containment experiment for AI incident response agents"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
false-containment = "false_containment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
