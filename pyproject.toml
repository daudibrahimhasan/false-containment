[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "falsecontain-bench"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
false-containment = "falsecontain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
